<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mortal Brutal - Arcade Engine</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background: #050508; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; width: 100vw; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* HUD Superior */
        #hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.85); border-bottom: 2px solid #f43b43; z-index: 10; height: 14vh; }
        .fighter-info { width: 40%; display: flex; flex-direction: column; gap: 4px; }
        .fighter-name { color: #fff; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .health-bar-container { width: 100%; height: 16px; background: #1a1a22; border: 2px solid #444; border-radius: 4px; overflow: hidden; position: relative; }
        .health-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff416c, #ff4b2b); transition: width 0.15s ease; }
        #p2-health { background: linear-gradient(90deg, #2b86ff, #1355ff); }
        .fighter-info.right { align-items: flex-end; }
        
        .round-counter { text-align: center; color: #ffd700; font-weight: 900; font-size: 15px; text-shadow: 0 0 10px rgba(255,215,0,0.6); }

        /* Área do Jogo (Palco) */
        #game-arena { position: relative; flex: 1; background: linear-gradient(to bottom, #150d20, #2c122b, #0b050a); overflow: hidden; display: flex; align-items: flex-end; }
        .floor { position: absolute; bottom: 0; width: 100%; height: 25px; background: linear-gradient(to top, #3a0000, #150813); border-top: 2px solid #f43b43; }
        
        /* Lutador Base */
        .fighter { position: absolute; bottom: 20px; width: 110px; height: 170px; display: flex; flex-direction: column; align-items: center; }
        
        /* Motor de Recorte Corrigido para a Sprite Sheet */
        .sprite-container { width: 110px; height: 150px; background-image: url('img/1791821167050.jpg'); background-size: 560px 310px; background-repeat: no-repeat; }
        
        /* Posições exatas de cada pose na imagem */
        .pose-idle { background-position: -12px -15px; }
        .pose-walk { background-position: -125px -15px; }
        .pose-punch { background-position: -350px -15px; }
        .pose-kick { background-position: -125px -165px; }
        .pose-special { background-position: -238px -165px; }

        .fighter-tag { color: #fff; font-size: 10px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 3px; margin-top: 2px; font-weight: bold; }

        /* Projétil do Especial */
        .dragon-effect { position: absolute; width: 70px; height: 50px; background: radial-gradient(circle, #ff4b2b, #ff416c, transparent); border-radius: 50%; display: none; z-index: 5; box-shadow: 0 0 25px #ff4b2b; }

        /* Comandos Táteis (Controles Mobile) */
        #controls { height: 36vh; background: rgba(8,8,12,0.98); border-top: 2px solid #222; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; z-index: 20; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 4px; }
        .action-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 58%; }
        
        .btn { background: #1c1c24; color: #fff; border: 2px solid #333; border-radius: 12px; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
        .btn:active { background: #f43b43; border-color: #ff4b2b; transform: scale(0.95); }
        
        .d-btn { width: 46px; height: 46px; font-size: 16px; background: #15151c; }
        .action-btn { width: 64px; height: 48px; background: #1a1a24; }
        .special-btn { width: 115px; height: 48px; background: linear-gradient(135deg, #f43b43, #b31217); border-color: #ff4b2b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-jump { grid-column: 2; grid-row: 1; }
    </style>
</head>
